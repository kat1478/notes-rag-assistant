<head>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafafa; --panel:#fff; --sunken:#f4f4f5; --line:#e4e4e7; --text:#18181b; --text2:#52525b; --text3:#a1a1aa;
          --hl:#fde68a; --hl-line:#d97706; --ok:#15803d; --bad:#b91c1c; --warn:#b45309;
          --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --panel:#0f0f11; --sunken:#18181b; --line:#27272a; --text:#f4f4f5; --text2:#a1a1aa; --text3:#71717a;
            --hl:rgba(251,191,36,.28); --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 var(--sans); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font:600 14px var(--mono); }
  .progress { flex:1; height:6px; background:var(--sunken); border-radius:3px; overflow:hidden; }
  .progress i { display:block; height:100%; background:var(--hl-line); width:0; transition:width .2s; }
  .count { font:12px var(--mono); color:var(--text2); }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; min-width:0; }
  h2 { font:600 11px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--text2); margin-bottom:8px; }
  .q { font-size:17px; font-weight:500; margin-bottom:14px; }
  ul.kp { padding-left:18px; margin-bottom:6px; } ul.kp li { margin:2px 0; }
  .answer { white-space:pre-wrap; background:var(--sunken); border-radius:4px; padding:12px; }
  details { border-top:1px solid var(--line); padding:8px 0; } summary { cursor:pointer; font:12.5px var(--mono); color:var(--text2); }
  details p { white-space:pre-wrap; font-size:13.5px; color:var(--text2); margin-top:6px; }
  .rate { grid-column:1 / -1; display:grid; gap:14px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .row .label { width:270px; font-size:14px; color:var(--text2); }
  button { font:500 13.5px var(--sans); padding:6px 12px; border-radius:4px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  button kbd { font:11px var(--mono); color:var(--text3); margin-left:6px; }
  button.on { background:var(--hl); border-color:var(--hl-line); }
  button:focus-visible { outline:2px solid var(--hl-line); outline-offset:2px; }
  textarea { width:100%; min-height:44px; font:13.5px var(--sans); padding:8px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--text); }
  .nav { display:flex; gap:8px; justify-content:space-between; }
  .help { font-size:13px; color:var(--text3); }
  .done { grid-column:1 / -1; text-align:center; padding:40px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } .row .label { width:100%; } }
</style>

<script>
const ITEMS = [{"item": 1, "question": "How does holdout help estimate model quality?", "key_points": ["losowy podział danych na rozłączne zbiory trenujący i testowy", "błąd na zbiorze testowym służy jako estymator błędu rzeczywistego"], "context": [{"n": 1, "file": "notatka_11_indukcja.txt", "text": "Intuicyjnie przypomina to sytuację, w której człowiek uczy się rozpoznawać pojęcia (np. figury geometryczne jak prostokąty) na podstawie podanych wcześniej wzorców pozytywnych i negatywnych. W zadaniu klasyfikacji dążymy do znalezienia modelu h: X -> C, który jak najlepiej przybliża nieznane pojęcie docelowe c: X -> C, gdzie C to skończony zbiór klas. Przykładem takiej dziedziny mogą być punkty na płaszczyźnie R^2, gdzie klasę pojęć reprezentują prostokąty o bokach równoległych do osi układu."}, {"n": 2, "file": "notatka_11_indukcja.txt", "text": "W algorytmach spójnych, takich jak eliminacja kandydatów (CAE), dąży się do wyznaczenia przestrzeni wersji, czyli zbioru modeli o zerowym błędzie na zbiorze trenującym, za pomocą ogólnego ograniczenia G i szczegółowego ograniczenia S. Implementacja takiego przeszukiwania w kodzie opiera się na pętli iterującej po przykładach i warunkowej aktualizacji zbiorów poprzez specjalizację modeli z G lub generalizację modeli z S."}, {"n": 3, "file": "notatka_11_indukcja.txt", "text": "Jeśli ktoś zapyta, jaka jest wielkość przestrzeni modeli dla koniunkcji boolowskich przy n atrybutach, to wzór określa ją dokładnie jako |H| = 3^n + 1. Pytając o to, czym różni się obciążenie reprezentacji od obciążenie preferencji, należy odpowiedzieć, że pierwsze zawęża przestrzeń modeli dostępną dla algorytmu, a drugie wprowadza kryteria wyboru, np. preferencję dla modeli prostszych."}, {"n": 4, "file": "notatka_12_jakosc.txt", "text": "Celem analizy jakości modeli jest rzetelne oszacowanie ich błędu rzeczywistego, aby zapobiec zjawisku nadmiernego dopasowania (overfittingu). Z definicji błąd klasyfikacji na konkretnym zbiorze danych S to stosunek liczby błędnie sklasyfikowanych obiektów do całkowitego rozmiaru tego zbioru, co zapisujemy wzorem e_S,c(h) = |{x w S : h(x) != c(x)}| / |S|. Intuicyjnie, jeśli model idealnie pamięta dane treningowe, ale wykłada się na nowych przykładach, oznacza to, że dopasował się do szumu, a nie"}, {"n": 5, "file": "notatka_12_jakosc.txt", "text": "do ogólnej reguły. Przykładem radzenia sobie z tym problemem jest holdout, czyli losowy podział danych na rozłączne zbiory trenujący T i testowy Q, gdzie błąd na zbiorze testowym służy jako estymator błędu rzeczywistego. Jeszcze lepszą procedurą jest k-krotna walidacja krzyżowa (k-CV), gdzie dane dzielone są na k części, a proces uczenia i testowania powtarza się k razy. W kodzie realizuje się to poprzez pętlę for i wyznaczanie wskaźników w trybie makro-uśredniania lub mikro-uśredniania."}, {"n": 6, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 7, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}, {"n": 8, "file": "syn_12_regularization.txt", "text": " Early stopping is the simplest technique: you monitor the validation loss and stop training when it stops improving for a few epochs (the patience), keeping the best weights. More training data is also a form of regularization, which is why data augmentation, such as flipping or cropping images, helps."}], "answer": "Holdout helps estimate model quality by randomly splitting the data into two disjoint sets: a training set (T) and a test set (Q). The model is trained on the training set and then evaluated on the test set, where the error on the test set serves as an estimator of the model's real-world performance, helping to prevent overfitting [Source 5]."}, {"item": 2, "question": "Why does Adam need bias correction?", "key_points": ["m and v are initialised with zeros", "so they are biased low at the start", "divide by 1 - beta^t"], "context": [{"n": 1, "file": "student_note_06_relu.txt", "text": "ReLU, which stands for Rectified Linear Unit, is probably the most popular activation function in deep learning today. Its formula is incredibly simple: f(x) = max(0, x). This means that if the input is positive, the function just returns that value, but if the input is zero or negative, it returns zero. This simplicity makes it computationally very efficient, especially when compared to functions like Sigmoid or Tanh, which require expensive exponential calculations."}, {"n": 2, "file": "student_note_06_relu.txt", "text": "ReLU is essential because it introduces non-linearity, allowing neural networks to learn complex functions and patterns. One interesting detail is its derivative: it is exactly 1 for any positive value and 0 for anything else. However, we have to watch out for the 'dying ReLU' problem, where neurons get stuck at zero and stop learning because their gradient is zero. If you pass -5 into a ReLU neuron, the output is 0. If you pass that 0 into another ReLU, the output stays 0."}, {"n": 3, "file": "student_note_06_relu.txt", "text": " Changing a car tire requires a jack and a wrench, but ReLU only requires a simple comparison against zero."}, {"n": 4, "file": "syn_03_momentum_adam.txt", "text": "Zwykły spadek gradientu ma problem, kiedy funkcja kosztu wygląda jak wąska dolina: kroki skaczą od ściany do ściany i postęp wzdłuż doliny jest bardzo wolny. Momentum to poprawka, która dodaje \"pęd\": zamiast iść tylko zgodnie z bieżącym gradientem, trzymamy wykładniczo ważoną średnią poprzednich gradientów, v = beta * v + gradient, a potem robimy krok w = w - lr * v. Typowa wartość beta to 0.9. Dzięki temu oscylacje się wygaszają, a w spójnym kierunku krok przyspiesza."}, {"n": 5, "file": "syn_03_momentum_adam.txt", "text": "Adam (Adaptive Moment Estimation) idzie dalej i łączy momentum z pomysłem z RMSprop. Trzyma dwie średnie: pierwszy moment m (średnia gradientów, beta1 = 0.9) i drugi moment v (średnia kwadratów gradientów, beta2 = 0.999). Krok dla każdego parametru jest dzielony przez pierwiastek z v plus mała stała epsilon (zwykle 1e-8), więc każdy parametr ma w praktyce własny learning rate. Ważny szczegół to korekta obciążenia (bias correction): na początku m i v są zainicjalizowane zerami, więc są"}, {"n": 6, "file": "syn_03_momentum_adam.txt", "text": "zaniżone, dlatego dzieli się je przez (1 - beta^t). Domyślny learning rate w Adamie to 0.001. Adam zwykle działa dobrze \"z pudełka\", dlatego jest domyślnym wyborem przy trenowaniu sieci neuronowych, chociaż czasem zwykłe SGD z momentum daje lepszą generalizację."}, {"n": 7, "file": "syn_04_leaky_relu.txt", "text": "Leaky ReLU is a small change to ReLU that fixes the dying ReLU problem. Instead of returning zero for negative inputs, it returns a small slope: f(x) = x for x > 0 and f(x) = alpha * x for x <= 0, where alpha is usually 0.01. Because the gradient for negative inputs is alpha instead of zero, a neuron that ends up with negative inputs can still receive updates and recover, so it never becomes permanently dead. For example, an input of -5 gives -0.05 with alpha = 0.01."}, {"n": 8, "file": "syn_04_leaky_relu.txt", "text": "PReLU (Parametric ReLU) takes the same idea but makes alpha a parameter that the network learns during training, so each channel can find its own slope. ELU (Exponential Linear Unit) uses alpha * (e^x - 1) for negative inputs, which is smooth and pushes mean activations closer to zero, at the cost of computing an exponential. GELU is a smooth activation that weights the input by the probability that a standard normal variable is smaller than it; it is the default activation in transformer"}, {"n": 9, "file": "syn_04_leaky_relu.txt", "text": "models like BERT and GPT. In practice: start with ReLU, switch to Leaky ReLU if many neurons die, and use GELU if you are building a transformer."}], "answer": "Adam needs bias correction because its moment estimates m and v are initialized to zeros, which makes them biased low at the start of training, so they are divided by (1 - beta^t) to correct this [Source 5] [Source 6]."}, {"item": 3, "question": "What is Bellman-Ford used for?", "key_points": ["single-source shortest paths", "works with negative edge weights", "detects negative cycles"], "context": [{"n": 1, "file": "syn_01_bellman_ford.txt", "text": "Najfajniejsza rzecz to wykrywanie ujemnych cykli: po V-1 przebiegach robimy jeszcze jeden, V-ty przebieg. Jeśli jakaś odległość nadal da się zmniejszyć, to znaczy, że w grafie jest cykl o ujemnej sumie wag i najkrótsza ścieżka po prostu nie istnieje (można kręcić się w kółko i zmniejszać koszt w nieskończoność). Na wykładzie był przykład z kursami walut: jeśli wagi to minus logarytmy kursów, ujemny cykl oznacza okazję do arbitrażu."}, {"n": 2, "file": "syn_01_bellman_ford.txt", "text": " W praktyce można przerwać algorytm wcześniej, jeśli w którymś przebiegu żadna odległość się nie zmieniła. Bellman-Ford jest też podstawą protokołów routingu typu distance-vector, gdzie każdy router zna tylko odległości od sąsiadów."}, {"n": 3, "file": "syn_05_bm25.txt", "text": "The parameter k1 controls how fast it saturates; typical values are between 1.2 and 2.0. Second, document length normalization: a long document naturally contains more words, so BM25 divides by the document length relative to the average document length. The parameter b controls how strong this normalization is; b = 0.75 is the usual default, b = 0 turns length normalization off and b = 1 applies it fully. The IDF part is similar to TF-IDF: rare terms get a higher weight than common ones."}, {"n": 4, "file": "syn_05_bm25.txt", "text": " BM25 is a lexical method, so it only matches exact words; it does not know that \"car\" and \"automobile\" mean the same thing. That is why modern retrieval systems often combine BM25 with dense embeddings in a hybrid search."}, {"n": 5, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 6, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}, {"n": 7, "file": "syn_12_regularization.txt", "text": " Early stopping is the simplest technique: you monitor the validation loss and stop training when it stops improving for a few epochs (the patience), keeping the best weights. More training data is also a form of regularization, which is why data augmentation, such as flipping or cropping images, helps."}], "answer": "Bellman–Ford is used to compute shortest paths, detect negative-weight cycles, and underpin distance-vector routing protocols. It can also identify arbitrage opportunities when currency exchange rates are represented as negative logarithmic weights. [Source 1] [Source 2]"}, {"item": 4, "question": "Why is 'low + (high - low) / 2' preferred when calculating the midpoint?", "key_points": ["avoids integer overflow", "important for very large arrays"], "context": [{"n": 1, "file": "student_note_04_binary_search.txt", "text": "Binary search is the go-to algorithm when you need to find something in a sorted list very quickly. Instead of checking every single element from the beginning (which is called Linear Search), we use a divide-and-conquer strategy. We look at the middle element of the array. If the middle is exactly what we are looking for, we are done. If our target is smaller, we throw away the right half of the array and repeat the process on the left half. If it's larger, we focus on the right half."}, {"n": 2, "file": "student_note_04_binary_search.txt", "text": "Because we halve the search space every single time, the average and worst-case time complexity is O(log n), which is incredibly fast compared to O(n) for linear search. When calculating the midpoint, it is often better to use 'low + (high - low) / 2' to avoid integer overflow issues that can happen in some languages with very large arrays. For example, if you have an array [1, 3, 5, 7, 9] and want to find 7, you start with the middle (5)."}, {"n": 3, "file": "student_note_04_binary_search.txt", "text": " Since 7 > 5, you look at the right side [7, 9], find the new middle (7), and you're done in just two steps. The capital of Australia is Canberra, but that's a geographical fact, not a part of binary search logic."}, {"n": 4, "file": "syn_02_a_star.txt", "text": "If h never overestimates the true remaining cost, it is called admissible, and then A* is guaranteed to return an optimal path. A stronger property is consistency (monotonicity): h(n) <= cost(n, n') + h(n') for every edge; a consistent heuristic is always admissible and means a node never has to be reopened. On a grid where you can only move up, down, left and right, the Manhattan distance |dx| + |dy| is a good admissible heuristic; if diagonal moves are allowed you would use something else."}, {"n": 5, "file": "syn_02_a_star.txt", "text": " If you set h(n) = 0 for every node, A* behaves exactly like Dijkstra's algorithm. A better heuristic means fewer expanded nodes, which is why A* is popular in game pathfinding and robot navigation. The main downside is memory: A* keeps every generated node in memory, which can be a problem on huge graphs."}, {"n": 6, "file": "syn_08_precision_recall.txt", "text": "Accuracy can be misleading when classes are imbalanced: if only 1% of emails are spam, a model that never predicts spam is 99% accurate and completely useless. That is why we look at the confusion matrix, which counts true positives (TP), false positives (FP), true negatives (TN) and false negatives (FN). Precision = TP / (TP + FP) answers the question \"of everything the model flagged as spam, how much really was spam?\"."}, {"n": 7, "file": "syn_08_precision_recall.txt", "text": "Recall (also called sensitivity) = TP / (TP + FN) answers \"of all real spam, how much did the model catch?\". There is a trade-off between them controlled by the decision threshold: raising the threshold makes the model more careful, which usually increases precision and lowers recall; lowering it does the opposite. Which one matters more depends on the cost of mistakes. For a spam filter, precision matters because a false positive hides a real email."}, {"n": 8, "file": "syn_08_precision_recall.txt", "text": " For cancer screening, recall matters because a missed case (false negative) is much worse than a false alarm. The F1 score combines both as the harmonic mean: F1 = 2 * precision * recall / (precision + recall). The harmonic mean punishes imbalance, so a model with precision 1.0 and recall 0.1 gets an F1 of only about 0.18."}], "answer": "The notes say that 'low + (high - low) / 2' is preferred because it avoids integer overflow issues that can happen in some languages with very large arrays. [Source 2]"}, {"item": 5, "question": "How is IDF calculated in the notes?", "key_points": ["logarithm of total number of documents divided by the number of documents containing the term"], "context": [{"n": 1, "file": "student_note_02_tfidf.txt", "text": "TF-IDF stands for Term Frequency-Inverse Document Frequency and it is a classic technique to turn text into numbers that a computer can understand. The whole point is to figure out which words actually matter in a document. TF (Term Frequency) is simple – it’s just how many times a word appears in a specific text. But that's not enough because common words like 'the' or 'and' appear everywhere. That is why we use IDF (Inverse Document Frequency)."}, {"n": 2, "file": "student_note_02_tfidf.txt", "text": "We calculate IDF as the logarithm of the total number of documents divided by the number of documents containing that specific term. This log function is crucial because it dampens the effect of high-frequency words. When you multiply TF by IDF, you get a score where high values mean the word is both frequent in your document and rare in the rest of the collection. This is way better than a simple Bag of Words count, which doesn't care about word importance."}, {"n": 3, "file": "student_note_02_tfidf.txt", "text": " For example, if you have 100 documents and a word appears in 10 of them, your IDF is log(10). If that word shows up 5 times in your target doc, you just multiply that 5 by the log value to get the final relevance score. It has nothing to do with football world cups, just pure statistics."}, {"n": 4, "file": "syn_05_bm25.txt", "text": "BM25 (Best Matching 25) is the ranking function used by most classic search engines, including Elasticsearch and Lucene by default. It can be seen as an improved TF-IDF. Two ideas make it better. First, term frequency saturation: in plain TF-IDF a word that appears 20 times counts twice as much as one that appears 10 times, but in BM25 the contribution of term frequency grows quickly at first and then flattens out."}, {"n": 5, "file": "syn_05_bm25.txt", "text": "The parameter k1 controls how fast it saturates; typical values are between 1.2 and 2.0. Second, document length normalization: a long document naturally contains more words, so BM25 divides by the document length relative to the average document length. The parameter b controls how strong this normalization is; b = 0.75 is the usual default, b = 0 turns length normalization off and b = 1 applies it fully. The IDF part is similar to TF-IDF: rare terms get a higher weight than common ones."}, {"n": 6, "file": "syn_05_bm25.txt", "text": " BM25 is a lexical method, so it only matches exact words; it does not know that \"car\" and \"automobile\" mean the same thing. That is why modern retrieval systems often combine BM25 with dense embeddings in a hybrid search."}], "answer": "We calculate IDF as the logarithm of the total number of documents divided by the number of documents containing that specific term. [Source 2]"}, {"item": 6, "question": "How is Dijkstra different from A*?", "key_points": ["Dijkstra does not use a heuristic", "A* uses a heuristic"], "context": [{"n": 1, "file": "syn_02_a_star.txt", "text": "A* (A-star) is a best-first search algorithm for finding the shortest path from a start node to a single goal node. For every node it computes f(n) = g(n) + h(n), where g(n) is the real cost from the start to n and h(n) is a heuristic estimate of the remaining cost from n to the goal. The algorithm always expands the node with the lowest f from a priority queue (the open set). The heuristic is the whole trick."}, {"n": 2, "file": "syn_02_a_star.txt", "text": "If h never overestimates the true remaining cost, it is called admissible, and then A* is guaranteed to return an optimal path. A stronger property is consistency (monotonicity): h(n) <= cost(n, n') + h(n') for every edge; a consistent heuristic is always admissible and means a node never has to be reopened. On a grid where you can only move up, down, left and right, the Manhattan distance |dx| + |dy| is a good admissible heuristic; if diagonal moves are allowed you would use something else."}, {"n": 3, "file": "syn_02_a_star.txt", "text": " If you set h(n) = 0 for every node, A* behaves exactly like Dijkstra's algorithm. A better heuristic means fewer expanded nodes, which is why A* is popular in game pathfinding and robot navigation. The main downside is memory: A* keeps every generated node in memory, which can be a problem on huge graphs."}], "answer": "Dijkstra's algorithm is similar to A*, but if you set h(n) = 0 for every node, it behaves exactly like Dijkstra's algorithm. [Source 1]"}, {"item": 7, "question": "Who wrote “Pan Tadeusz”?", "key_points": ["Adam Mickiewicz wrote Pan Tadeusz", "lies completely outside the thematic scope of inductive learning"], "context": [{"n": 1, "file": "notatka_11_indukcja.txt", "text": "Jeśli ktoś zapyta, jaka jest wielkość przestrzeni modeli dla koniunkcji boolowskich przy n atrybutach, to wzór określa ją dokładnie jako |H| = 3^n + 1. Pytając o to, czym różni się obciążenie reprezentacji od obciążenie preferencji, należy odpowiedzieć, że pierwsze zawęża przestrzeń modeli dostępną dla algorytmu, a drugie wprowadza kryteria wyboru, np. preferencję dla modeli prostszych."}, {"n": 2, "file": "notatka_11_indukcja.txt", "text": " Z kolei na pytanie, kto napisał \"Pana Tadeusza\", poprawna odpowiedź brzmi, że Adam Mickiewicz, ale ta informacja leży całkowicie poza zakresem tematycznym indukcyjnego uczenia się."}, {"n": 3, "file": "notatka_studenta_05_drzewa.txt", "text": "Na tej podstawie liczymy Zysk Informacyjny (Information Gain), czyli sprawdzamy, o ile spadła entropia po dokonaniu podziału. Wybieramy ten podział, który daje największy zysk. Drzewa są super, bo łatwo je zrozumieć, ale mają tendencję do overfittingu, czyli \"uczenia się danych na pamięć\". Dlatego często łączy się je w Lasy Losowe (Random Forest), gdzie budujemy wiele drzew i wyciągamy z nich średnią lub głosujemy."}, {"n": 4, "file": "notatka_studenta_05_drzewa.txt", "text": " Różnica polega na tym, że las jest znacznie bardziej stabilny i odporny na błędy pojedynczego drzewa. Adam Mickiewicz napisał 'Pana Tadeusza', ale nie sądzę, żeby używał do tego drzew decyzyjnych."}, {"n": 5, "file": "syn_09_knn.txt", "text": "1) daje model bardzo wrażliwy na szum, a duże k wygładza granicę decyzyjną, ale może zatrzeć mniejsze klasy. W klasyfikacji binarnej warto wybierać nieparzyste k, żeby uniknąć remisów w głosowaniu. Przed użyciem k-NN trzeba przeskalować cechy (np. standaryzacja), bo inaczej cecha o dużym zakresie, jak pensja w złotówkach, zdominuje odległość nad cechą typu wiek. Problemem jest przekleństwo wymiarowości: w bardzo wielu wymiarach wszystkie punkty są od siebie prawie tak samo daleko, więc"}, {"n": 6, "file": "syn_09_knn.txt", "text": "\"najbliższy sąsiad\" przestaje coś znaczyć. Predykcja jest kosztowna, bo dla każdego zapytania trzeba policzyć odległości do całego zbioru."}], "answer": "Adam Mickiewicz. [Source 2]"}, {"item": 8, "question": "How does SGD differ from batch gradient descent?", "key_points": ["SGD updates after each example", "batch uses the whole dataset", "SGD introduces noise", "SGD can escape local minima more easily"], "context": [{"n": 1, "file": "notatka_studenta_01_gradient.txt", "text": "Spadek gradientu to w sumie najważniejszy algorytm optymalizacyjny, jakiego używamy w uczeniu maszynowym do minimalizacji funkcji kosztu. Chodzi o to, żeby iteracyjnie schodzić w dół zbocza funkcji, aż znajdziemy jej minimum. Kluczowym pojęciem jest tutaj gradient, czyli wektor pochodnych cząstkowych, który zawsze pokazuje kierunek najszybszego wzrostu. Dlatego we wzorze mamy minus przed gradientem – chcemy iść w stronę przeciwną."}, {"n": 2, "file": "notatka_studenta_01_gradient.txt", "text": "Parametr alfa, czyli learning rate, decyduje o tym, jak duże kroki robimy. Jeśli ustawimy zbyt dużą alfę, to możemy \"przeskoczyć\" minimum i algorytm nigdy nie zbiegnie, a jeśli za małą, to obliczenia zajmą wieczność. W praktyce rzadko używamy czystego spadku gradientu na całym zbiorze danych (batch), bo to wolne. Częściej stosuje się SGD (stochastyczny spadek gradientu), który aktualizuje parametry po każdym przykładzie, co wprowadza trochę szumu, ale pozwala szybciej uciekać z lokalnych"}, {"n": 3, "file": "notatka_studenta_01_gradient.txt", "text": "minimów. Żeby obliczyć nową wartość parametrów (theta), bierzemy obecne theta i odejmujemy od nich iloczyn alfy i gradientu. Pogoda w Warszawie nie ma tu nic do rzeczy, bo algorytm interesuje tylko matematyka funkcji kosztu."}, {"n": 4, "file": "syn_08_precision_recall.txt", "text": "Accuracy can be misleading when classes are imbalanced: if only 1% of emails are spam, a model that never predicts spam is 99% accurate and completely useless. That is why we look at the confusion matrix, which counts true positives (TP), false positives (FP), true negatives (TN) and false negatives (FN). Precision = TP / (TP + FP) answers the question \"of everything the model flagged as spam, how much really was spam?\"."}, {"n": 5, "file": "syn_08_precision_recall.txt", "text": "Recall (also called sensitivity) = TP / (TP + FN) answers \"of all real spam, how much did the model catch?\". There is a trade-off between them controlled by the decision threshold: raising the threshold makes the model more careful, which usually increases precision and lowers recall; lowering it does the opposite. Which one matters more depends on the cost of mistakes. For a spam filter, precision matters because a false positive hides a real email."}, {"n": 6, "file": "syn_08_precision_recall.txt", "text": " For cancer screening, recall matters because a missed case (false negative) is much worse than a false alarm. The F1 score combines both as the harmonic mean: F1 = 2 * precision * recall / (precision + recall). The harmonic mean punishes imbalance, so a model with precision 1.0 and recall 0.1 gets an F1 of only about 0.18."}, {"n": 7, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 8, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}], "answer": "Batch gradient descent computes the gradient over the whole dataset, which is slow in practice. SGD (stochastic gradient descent) instead updates the parameters after each individual example. This introduces some noise, but it lets the algorithm escape local minima more quickly [Source 2]."}, {"item": 9, "question": "What is gradient descent used for?", "key_points": ["optimization algorithm", "minimizes a cost function", "iteratively moves toward a minimum"], "context": [{"n": 1, "file": "notatka_studenta_01_gradient.txt", "text": "Spadek gradientu to w sumie najważniejszy algorytm optymalizacyjny, jakiego używamy w uczeniu maszynowym do minimalizacji funkcji kosztu. Chodzi o to, żeby iteracyjnie schodzić w dół zbocza funkcji, aż znajdziemy jej minimum. Kluczowym pojęciem jest tutaj gradient, czyli wektor pochodnych cząstkowych, który zawsze pokazuje kierunek najszybszego wzrostu. Dlatego we wzorze mamy minus przed gradientem – chcemy iść w stronę przeciwną."}, {"n": 2, "file": "notatka_studenta_01_gradient.txt", "text": "Parametr alfa, czyli learning rate, decyduje o tym, jak duże kroki robimy. Jeśli ustawimy zbyt dużą alfę, to możemy \"przeskoczyć\" minimum i algorytm nigdy nie zbiegnie, a jeśli za małą, to obliczenia zajmą wieczność. W praktyce rzadko używamy czystego spadku gradientu na całym zbiorze danych (batch), bo to wolne. Częściej stosuje się SGD (stochastyczny spadek gradientu), który aktualizuje parametry po każdym przykładzie, co wprowadza trochę szumu, ale pozwala szybciej uciekać z lokalnych"}, {"n": 3, "file": "student_note_06_relu.txt", "text": "ReLU, which stands for Rectified Linear Unit, is probably the most popular activation function in deep learning today. Its formula is incredibly simple: f(x) = max(0, x). This means that if the input is positive, the function just returns that value, but if the input is zero or negative, it returns zero. This simplicity makes it computationally very efficient, especially when compared to functions like Sigmoid or Tanh, which require expensive exponential calculations."}, {"n": 4, "file": "student_note_06_relu.txt", "text": "ReLU is essential because it introduces non-linearity, allowing neural networks to learn complex functions and patterns. One interesting detail is its derivative: it is exactly 1 for any positive value and 0 for anything else. However, we have to watch out for the 'dying ReLU' problem, where neurons get stuck at zero and stop learning because their gradient is zero. If you pass -5 into a ReLU neuron, the output is 0. If you pass that 0 into another ReLU, the output stays 0."}, {"n": 5, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 6, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}], "answer": "Gradient descent is used for minimizing the cost function in machine learning by iteratively moving downhill along the gradient, which indicates the direction of the steepest increase, thus finding the minimum of the function [Source 1]."}, {"item": 10, "question": "Who wrote “Pan Tadeusz”?", "key_points": ["Adam Mickiewicz wrote Pan Tadeusz", "lies completely outside the thematic scope of inductive learning"], "context": [{"n": 1, "file": "notatka_11_indukcja.txt", "text": "Jeśli ktoś zapyta, jaka jest wielkość przestrzeni modeli dla koniunkcji boolowskich przy n atrybutach, to wzór określa ją dokładnie jako |H| = 3^n + 1. Pytając o to, czym różni się obciążenie reprezentacji od obciążenie preferencji, należy odpowiedzieć, że pierwsze zawęża przestrzeń modeli dostępną dla algorytmu, a drugie wprowadza kryteria wyboru, np. preferencję dla modeli prostszych."}, {"n": 2, "file": "notatka_11_indukcja.txt", "text": " Z kolei na pytanie, kto napisał \"Pana Tadeusza\", poprawna odpowiedź brzmi, że Adam Mickiewicz, ale ta informacja leży całkowicie poza zakresem tematycznym indukcyjnego uczenia się."}, {"n": 3, "file": "notatka_studenta_05_drzewa.txt", "text": "Na tej podstawie liczymy Zysk Informacyjny (Information Gain), czyli sprawdzamy, o ile spadła entropia po dokonaniu podziału. Wybieramy ten podział, który daje największy zysk. Drzewa są super, bo łatwo je zrozumieć, ale mają tendencję do overfittingu, czyli \"uczenia się danych na pamięć\". Dlatego często łączy się je w Lasy Losowe (Random Forest), gdzie budujemy wiele drzew i wyciągamy z nich średnią lub głosujemy."}, {"n": 4, "file": "notatka_studenta_05_drzewa.txt", "text": " Różnica polega na tym, że las jest znacznie bardziej stabilny i odporny na błędy pojedynczego drzewa. Adam Mickiewicz napisał 'Pana Tadeusza', ale nie sądzę, żeby używał do tego drzew decyzyjnych."}, {"n": 5, "file": "syn_09_knn.txt", "text": "1) daje model bardzo wrażliwy na szum, a duże k wygładza granicę decyzyjną, ale może zatrzeć mniejsze klasy. W klasyfikacji binarnej warto wybierać nieparzyste k, żeby uniknąć remisów w głosowaniu. Przed użyciem k-NN trzeba przeskalować cechy (np. standaryzacja), bo inaczej cecha o dużym zakresie, jak pensja w złotówkach, zdominuje odległość nad cechą typu wiek. Problemem jest przekleństwo wymiarowości: w bardzo wielu wymiarach wszystkie punkty są od siebie prawie tak samo daleko, więc"}, {"n": 6, "file": "syn_09_knn.txt", "text": "\"najbliższy sąsiad\" przestaje coś znaczyć. Predykcja jest kosztowna, bo dla każdego zapytania trzeba policzyć odległości do całego zbioru."}], "answer": "Adam Mickiewicz wrote “Pan Tadeusz.” [Source 2]"}, {"item": 11, "question": "Compare Q-Learning with Sarsa.", "key_points": ["Q-Learning jest off-policy (zakłada wybór akcji maksymalizującej Q)", "Sarsa jest on-policy (czeka na rzeczywisty wybór kolejnej akcji)"], "context": [{"n": 1, "file": "notatka_15_qlearning.txt", "text": "Kluczowym wyzwaniem jest dylemat eksploracji kontra eksploatacji, rozwiązywany np. przez strategię epsilon-zachłanną lub regułę Boltzmanna (soft-max). Jeśli padnie pytanie, pod jakimi warunkami tablicowy Q-Learning ma gwarancję zbieżności do wartości optymalnych, należy odpowiedzieć, że ciąg kroków beta musi spełniać warunki zbieżności deterministycznej, a prawdopodobieństwo wyboru każdej akcji w każdym stanie musi być zawsze większe od zera."}, {"n": 2, "file": "notatka_15_qlearning.txt", "text": " Pytając o porównanie Q-Learning z algorytmem Sarsa, poprawna odpowiedź brzmi, że Q-Learning jest algorytmem off-policy (w formule aktualizacji zakłada wybór akcji maksymalizującej Q w kolejnym stanie), podczas gdy Sarsa to on-policy (czeka na rzeczywisty wybór kolejnej akcji a_t+1 zgodnie z aktualną strategią). Pytanie o to, ile kosztuje bilet ulgowy do kina, jest całkowicie spoza zakresu notatki o Q-Learning."}, {"n": 3, "file": "syn_06_sarsa.txt", "text": "Sarsa to algorytm uczenia ze wzmocnieniem bardzo podobny do Q-Learningu, ale działający w trybie on-policy. Nazwa pochodzi od piątki (s, a, r, s', a'), czyli stan, akcja, nagroda, następny stan i następna akcja, której potrzebujemy do aktualizacji. Wzór aktualizacji: Q(s, a) := Q(s, a) + alfa * (r + gamma * Q(s', a') - Q(s, a)). Kluczowa różnica względem Q-Learningu: tam w aktualizacji bierzemy max po akcjach w następnym stanie, a w Sarsie bierzemy wartość akcji a', którą agent naprawdę"}, {"n": 4, "file": "syn_06_sarsa.txt", "text": "wybierze zgodnie ze swoją strategią, na przykład epsilon-zachłanną. Przez to Sarsa uczy się wartości strategii, którą faktycznie wykonuje, razem z jej losowymi ruchami eksploracyjnymi. Klasyczny przykład to cliff walking: agent idzie wzdłuż krawędzi klifu, a spadnięcie daje karę -100. Q-Learning uczy się ścieżki optymalnej tuż przy krawędzi, ale podczas nauki często spada przez eksplorację. Sarsa uczy się bezpieczniejszej ścieżki dalej od klifu, bo \"wie\", że czasem wykona losowy ruch."}, {"n": 5, "file": "syn_06_sarsa.txt", "text": " Dlatego Sarsa w trakcie uczenia zbiera zwykle wyższą sumę nagród, a Q-Learning znajduje lepszą ścieżkę końcową, jeśli eksploracja zostanie wyłączona."}], "answer": "**Core difference:** Q-Learning is an off-policy algorithm. In its update formula it assumes the action that maximizes Q in the next state. Sarsa is on-policy. It waits for the action a_t+1 that is actually chosen according to the current policy [Source 2].  **Sarsa update:** The name comes from the quintuple (s, a, r, s', a'). The update is Q(s, a) := Q(s, a) + alpha * (r + gamma * Q(s', a') - Q(s, a)). Q-Learning takes the max over actions in the next state, whereas Sarsa takes the value of the action a' that the agent will really choose under its policy, for example epsilon-greedy [Source 3][Source 4].  **Consequence:** Sarsa learns the value of the policy it actually executes, including its random exploratory moves [Source 4].  **Cliff walking example:** Falling off the cliff gives a penalty of -100. - Q-Learning learns the optimal path right at the edge, but often falls during learning because of exploration. - Sarsa learns a safer path farther from the cliff, since it \"knows\" it will sometimes make a random move [Source 4].  **Results:** During learning, Sarsa usually collects a higher total reward. Q-Learning finds the better final path if exploration is turned off [Source 5]."}, {"item": 12, "question": "What is the formula for recall?", "key_points": ["TP / (TP + FN)", "also called sensitivity"], "context": [{"n": 1, "file": "student_note_02_tfidf.txt", "text": "We calculate IDF as the logarithm of the total number of documents divided by the number of documents containing that specific term. This log function is crucial because it dampens the effect of high-frequency words. When you multiply TF by IDF, you get a score where high values mean the word is both frequent in your document and rare in the rest of the collection. This is way better than a simple Bag of Words count, which doesn't care about word importance."}, {"n": 2, "file": "student_note_02_tfidf.txt", "text": " For example, if you have 100 documents and a word appears in 10 of them, your IDF is log(10). If that word shows up 5 times in your target doc, you just multiply that 5 by the log value to get the final relevance score. It has nothing to do with football world cups, just pure statistics."}, {"n": 3, "file": "syn_08_precision_recall.txt", "text": "Accuracy can be misleading when classes are imbalanced: if only 1% of emails are spam, a model that never predicts spam is 99% accurate and completely useless. That is why we look at the confusion matrix, which counts true positives (TP), false positives (FP), true negatives (TN) and false negatives (FN). Precision = TP / (TP + FP) answers the question \"of everything the model flagged as spam, how much really was spam?\"."}, {"n": 4, "file": "syn_08_precision_recall.txt", "text": "Recall (also called sensitivity) = TP / (TP + FN) answers \"of all real spam, how much did the model catch?\". There is a trade-off between them controlled by the decision threshold: raising the threshold makes the model more careful, which usually increases precision and lowers recall; lowering it does the opposite. Which one matters more depends on the cost of mistakes. For a spam filter, precision matters because a false positive hides a real email."}, {"n": 5, "file": "syn_08_precision_recall.txt", "text": " For cancer screening, recall matters because a missed case (false negative) is much worse than a false alarm. The F1 score combines both as the harmonic mean: F1 = 2 * precision * recall / (precision + recall). The harmonic mean punishes imbalance, so a model with precision 1.0 and recall 0.1 gets an F1 of only about 0.18."}], "answer": "The formula for recall (which is also referred to as sensitivity) is TP / (TP + FN) [Source 4]."}, {"item": 13, "question": "Who wrote “Pan Tadeusz”?", "key_points": ["Adam Mickiewicz wrote Pan Tadeusz", "lies completely outside the thematic scope of inductive learning"], "context": [{"n": 1, "file": "notatka_11_indukcja.txt", "text": "Jeśli ktoś zapyta, jaka jest wielkość przestrzeni modeli dla koniunkcji boolowskich przy n atrybutach, to wzór określa ją dokładnie jako |H| = 3^n + 1. Pytając o to, czym różni się obciążenie reprezentacji od obciążenie preferencji, należy odpowiedzieć, że pierwsze zawęża przestrzeń modeli dostępną dla algorytmu, a drugie wprowadza kryteria wyboru, np. preferencję dla modeli prostszych."}, {"n": 2, "file": "notatka_11_indukcja.txt", "text": " Z kolei na pytanie, kto napisał \"Pana Tadeusza\", poprawna odpowiedź brzmi, że Adam Mickiewicz, ale ta informacja leży całkowicie poza zakresem tematycznym indukcyjnego uczenia się."}, {"n": 3, "file": "notatka_studenta_05_drzewa.txt", "text": "Na tej podstawie liczymy Zysk Informacyjny (Information Gain), czyli sprawdzamy, o ile spadła entropia po dokonaniu podziału. Wybieramy ten podział, który daje największy zysk. Drzewa są super, bo łatwo je zrozumieć, ale mają tendencję do overfittingu, czyli \"uczenia się danych na pamięć\". Dlatego często łączy się je w Lasy Losowe (Random Forest), gdzie budujemy wiele drzew i wyciągamy z nich średnią lub głosujemy."}, {"n": 4, "file": "notatka_studenta_05_drzewa.txt", "text": " Różnica polega na tym, że las jest znacznie bardziej stabilny i odporny na błędy pojedynczego drzewa. Adam Mickiewicz napisał 'Pana Tadeusza', ale nie sądzę, żeby używał do tego drzew decyzyjnych."}, {"n": 5, "file": "syn_09_knn.txt", "text": "1) daje model bardzo wrażliwy na szum, a duże k wygładza granicę decyzyjną, ale może zatrzeć mniejsze klasy. W klasyfikacji binarnej warto wybierać nieparzyste k, żeby uniknąć remisów w głosowaniu. Przed użyciem k-NN trzeba przeskalować cechy (np. standaryzacja), bo inaczej cecha o dużym zakresie, jak pensja w złotówkach, zdominuje odległość nad cechą typu wiek. Problemem jest przekleństwo wymiarowości: w bardzo wielu wymiarach wszystkie punkty są od siebie prawie tak samo daleko, więc"}, {"n": 6, "file": "syn_09_knn.txt", "text": "\"najbliższy sąsiad\" przestaje coś znaczyć. Predykcja jest kosztowna, bo dla każdego zapytania trzeba policzyć odległości do całego zbioru."}], "answer": "Adam Mickiewicz wrote \"Pan Tadeusz\" [Source 2][Source 4]."}, {"item": 14, "question": "What is information gain in decision trees?", "key_points": ["reduction in entropy after a split", "choose the split with the largest information gain"], "context": [{"n": 1, "file": "notatka_studenta_05_drzewa.txt", "text": "Drzewa decyzyjne to takie modele, które dzielą dane na mniejsze grupy na podstawie pytań o konkretne cechy. Każdy taki podział to węzeł, a tam, gdzie już nie da się nic podzielić i mamy ostateczny wynik (klasę lub wartość), nazywamy to liściem. Żeby wiedzieć, o co pytać najpierw, używamy entropii, która mierzy nieuporządkowanie w danych. Wzór na entropię to suma prawdopodobieństw pomnożonych przez ich logarytmy z minusem."}, {"n": 2, "file": "notatka_studenta_05_drzewa.txt", "text": "Na tej podstawie liczymy Zysk Informacyjny (Information Gain), czyli sprawdzamy, o ile spadła entropia po dokonaniu podziału. Wybieramy ten podział, który daje największy zysk. Drzewa są super, bo łatwo je zrozumieć, ale mają tendencję do overfittingu, czyli \"uczenia się danych na pamięć\". Dlatego często łączy się je w Lasy Losowe (Random Forest), gdzie budujemy wiele drzew i wyciągamy z nich średnią lub głosujemy."}, {"n": 3, "file": "notatka_studenta_05_drzewa.txt", "text": " Różnica polega na tym, że las jest znacznie bardziej stabilny i odporny na błędy pojedynczego drzewa. Adam Mickiewicz napisał 'Pana Tadeusza', ale nie sądzę, żeby używał do tego drzew decyzyjnych."}, {"n": 4, "file": "student_note_02_tfidf.txt", "text": "We calculate IDF as the logarithm of the total number of documents divided by the number of documents containing that specific term. This log function is crucial because it dampens the effect of high-frequency words. When you multiply TF by IDF, you get a score where high values mean the word is both frequent in your document and rare in the rest of the collection. This is way better than a simple Bag of Words count, which doesn't care about word importance."}, {"n": 5, "file": "student_note_02_tfidf.txt", "text": " For example, if you have 100 documents and a word appears in 10 of them, your IDF is log(10). If that word shows up 5 times in your target doc, you just multiply that 5 by the log value to get the final relevance score. It has nothing to do with football world cups, just pure statistics."}, {"n": 6, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 7, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}, {"n": 8, "file": "syn_12_regularization.txt", "text": " Early stopping is the simplest technique: you monitor the validation loss and stop training when it stops improving for a few epochs (the patience), keeping the best weights. More training data is also a form of regularization, which is why data augmentation, such as flipping or cropping images, helps."}], "answer": "Information gain in decision trees is a measure used to determine the best feature to split the data at each node. It is calculated by assessing how much the entropy (a measure of disorder or uncertainty in the data) decreases after a dataset is split on a particular feature. The split that results in the largest reduction in entropy—i.e., the highest information gain—is chosen as the optimal split. This process helps build a decision tree that effectively classifies data by making the most informative decisions at each step [Source 1]."}, {"item": 15, "question": "Why is the maximum logit subtracted before computing softmax?", "key_points": ["numerical stability / avoids overflow of e^z", "does not change the result"], "context": [{"n": 1, "file": "student_note_06_relu.txt", "text": "ReLU, which stands for Rectified Linear Unit, is probably the most popular activation function in deep learning today. Its formula is incredibly simple: f(x) = max(0, x). This means that if the input is positive, the function just returns that value, but if the input is zero or negative, it returns zero. This simplicity makes it computationally very efficient, especially when compared to functions like Sigmoid or Tanh, which require expensive exponential calculations."}, {"n": 2, "file": "student_note_06_relu.txt", "text": "ReLU is essential because it introduces non-linearity, allowing neural networks to learn complex functions and patterns. One interesting detail is its derivative: it is exactly 1 for any positive value and 0 for anything else. However, we have to watch out for the 'dying ReLU' problem, where neurons get stuck at zero and stop learning because their gradient is zero. If you pass -5 into a ReLU neuron, the output is 0. If you pass that 0 into another ReLU, the output stays 0."}, {"n": 3, "file": "syn_11_softmax.txt", "text": "Softmax zamienia wektor dowolnych liczb (tzw. logitów) na rozkład prawdopodobieństwa: softmax(z_i) = e^(z_i) / suma_j e^(z_j). Wszystkie wyniki są dodatnie i sumują się do 1, dlatego softmax stosuje się w ostatniej warstwie klasyfikatora wieloklasowego. Funkcja wykładnicza wzmacnia różnice, więc największy logit dostaje wyraźnie największe prawdopodobieństwo. Często dodaje się parametr temperatury T: softmax(z_i / T)."}, {"n": 4, "file": "syn_11_softmax.txt", "text": "Przy T < 1 rozkład robi się bardziej \"ostry\" i prawie cała masa trafia do największego logitu, a przy T > 1 rozkład się spłaszcza i robi bardziej równomierny. Dokładnie tak działa temperatura przy generowaniu tekstu przez modele językowe: niska temperatura to bardziej przewidywalne odpowiedzi, wysoka to bardziej losowe. Do trenowania klasyfikatora z softmaxem używa się entropii krzyżowej (cross-entropy): L = -suma_i y_i * log(p_i), co przy etykiecie one-hot sprowadza się do minus logarytmu"}, {"n": 5, "file": "syn_11_softmax.txt", "text": "prawdopodobieństwa poprawnej klasy. Praktyczny szczegół to stabilność numeryczna: e^z dla dużych logitów przepełnia zakres liczb, więc przed liczeniem odejmuje się od wszystkich logitów ich maksimum, co nie zmienia wyniku."}], "answer": "The maximum logit is subtracted to prevent numerical overflow when exponentiating large logits. This shift does not change the resulting softmax probabilities. [Source 5]"}, {"item": 16, "question": "Compare Sarsa and Q-Learning in the cliff walking example.", "key_points": ["Sarsa learns the safer path, Q-Learning the optimal path near the edge", "Sarsa on-policy, Q-Learning off-policy"], "context": [{"n": 1, "file": "notatka_15_qlearning.txt", "text": "Kluczowym wyzwaniem jest dylemat eksploracji kontra eksploatacji, rozwiązywany np. przez strategię epsilon-zachłanną lub regułę Boltzmanna (soft-max). Jeśli padnie pytanie, pod jakimi warunkami tablicowy Q-Learning ma gwarancję zbieżności do wartości optymalnych, należy odpowiedzieć, że ciąg kroków beta musi spełniać warunki zbieżności deterministycznej, a prawdopodobieństwo wyboru każdej akcji w każdym stanie musi być zawsze większe od zera."}, {"n": 2, "file": "notatka_15_qlearning.txt", "text": " Pytając o porównanie Q-Learning z algorytmem Sarsa, poprawna odpowiedź brzmi, że Q-Learning jest algorytmem off-policy (w formule aktualizacji zakłada wybór akcji maksymalizującej Q w kolejnym stanie), podczas gdy Sarsa to on-policy (czeka na rzeczywisty wybór kolejnej akcji a_t+1 zgodnie z aktualną strategią). Pytanie o to, ile kosztuje bilet ulgowy do kina, jest całkowicie spoza zakresu notatki o Q-Learning."}, {"n": 3, "file": "syn_06_sarsa.txt", "text": "Sarsa to algorytm uczenia ze wzmocnieniem bardzo podobny do Q-Learningu, ale działający w trybie on-policy. Nazwa pochodzi od piątki (s, a, r, s', a'), czyli stan, akcja, nagroda, następny stan i następna akcja, której potrzebujemy do aktualizacji. Wzór aktualizacji: Q(s, a) := Q(s, a) + alfa * (r + gamma * Q(s', a') - Q(s, a)). Kluczowa różnica względem Q-Learningu: tam w aktualizacji bierzemy max po akcjach w następnym stanie, a w Sarsie bierzemy wartość akcji a', którą agent naprawdę"}, {"n": 4, "file": "syn_06_sarsa.txt", "text": "wybierze zgodnie ze swoją strategią, na przykład epsilon-zachłanną. Przez to Sarsa uczy się wartości strategii, którą faktycznie wykonuje, razem z jej losowymi ruchami eksploracyjnymi. Klasyczny przykład to cliff walking: agent idzie wzdłuż krawędzi klifu, a spadnięcie daje karę -100. Q-Learning uczy się ścieżki optymalnej tuż przy krawędzi, ale podczas nauki często spada przez eksplorację. Sarsa uczy się bezpieczniejszej ścieżki dalej od klifu, bo \"wie\", że czasem wykona losowy ruch."}, {"n": 5, "file": "syn_06_sarsa.txt", "text": " Dlatego Sarsa w trakcie uczenia zbiera zwykle wyższą sumę nagród, a Q-Learning znajduje lepszą ścieżkę końcową, jeśli eksploracja zostanie wyłączona."}], "answer": "In the cliff walking example, Q-Learning learns the optimal path right next to the cliff's edge, but it often falls during the learning process due to exploration [Source 4]. In contrast, Sarsa learns a safer path further away from the cliff because it \"knows\" that it will occasionally perform a random move [Source 4]. Consequently, Sarsa typically collects a higher sum of rewards during the learning process, while Q-Learning finds a better final path if exploration is disabled [Source 5]."}, {"item": 17, "question": "What makes Q-Learning an off-policy algorithm?", "key_points": ["w formule aktualizacji zakłada wybór akcji maksymalizującej Q w kolejnym stanie, niezależnie od strategii"], "context": [{"n": 1, "file": "notatka_15_qlearning.txt", "text": "Celem algorytmu Q-Learning jest wyznaczenie optymalnej funkcji wartości akcji Q* bez konieczności znajomości modelu matematycznego środowiska. Definiuje się go jako bezmodelowy algorytm uczenia się ze wzmocnieniem realizowany w trybie off-policy. Intuicyjnie uczeń porusza się po świecie po omacku i aktualizuje swoją tablicę wiedzy na podstawie rzeczywistych, pojedynczych doświadczeń (symulacja Monte-Carlo równania Bellmana) zamiast liczenia teoretycznych wartości oczekiwanych."}, {"n": 2, "file": "notatka_15_qlearning.txt", "text": "Podstawowy wzór aktualizacji wartości w kroku t wygląda następująco: Q_t+1(x_t, a_t) := (1-beta) * Q_t(x_t, a_t) + beta * (r_t + gamma * max_a Q_t(x_t+1, a)), gdzie beta to rozmiar kroku, a gamma to współczynnik dyskontowania. Przykładem zastosowania jest sterowanie systemem wind lub nauka parkowania samochodu. W kodzie reprezentacja opiera się najczęściej na tablicy dwuwymiarowej dla stanów i akcji, a w przypadku ciągłych przestrzeni stosuje się aproksymację liniową lub sieci neuronowe."}, {"n": 3, "file": "notatka_15_qlearning.txt", "text": "Kluczowym wyzwaniem jest dylemat eksploracji kontra eksploatacji, rozwiązywany np. przez strategię epsilon-zachłanną lub regułę Boltzmanna (soft-max). Jeśli padnie pytanie, pod jakimi warunkami tablicowy Q-Learning ma gwarancję zbieżności do wartości optymalnych, należy odpowiedzieć, że ciąg kroków beta musi spełniać warunki zbieżności deterministycznej, a prawdopodobieństwo wyboru każdej akcji w każdym stanie musi być zawsze większe od zera."}, {"n": 4, "file": "notatka_15_qlearning.txt", "text": " Pytając o porównanie Q-Learning z algorytmem Sarsa, poprawna odpowiedź brzmi, że Q-Learning jest algorytmem off-policy (w formule aktualizacji zakłada wybór akcji maksymalizującej Q w kolejnym stanie), podczas gdy Sarsa to on-policy (czeka na rzeczywisty wybór kolejnej akcji a_t+1 zgodnie z aktualną strategią). Pytanie o to, ile kosztuje bilet ulgowy do kina, jest całkowicie spoza zakresu notatki o Q-Learning."}, {"n": 5, "file": "syn_06_sarsa.txt", "text": "Sarsa to algorytm uczenia ze wzmocnieniem bardzo podobny do Q-Learningu, ale działający w trybie on-policy. Nazwa pochodzi od piątki (s, a, r, s', a'), czyli stan, akcja, nagroda, następny stan i następna akcja, której potrzebujemy do aktualizacji. Wzór aktualizacji: Q(s, a) := Q(s, a) + alfa * (r + gamma * Q(s', a') - Q(s, a)). Kluczowa różnica względem Q-Learningu: tam w aktualizacji bierzemy max po akcjach w następnym stanie, a w Sarsie bierzemy wartość akcji a', którą agent naprawdę"}, {"n": 6, "file": "syn_06_sarsa.txt", "text": "wybierze zgodnie ze swoją strategią, na przykład epsilon-zachłanną. Przez to Sarsa uczy się wartości strategii, którą faktycznie wykonuje, razem z jej losowymi ruchami eksploracyjnymi. Klasyczny przykład to cliff walking: agent idzie wzdłuż krawędzi klifu, a spadnięcie daje karę -100. Q-Learning uczy się ścieżki optymalnej tuż przy krawędzi, ale podczas nauki często spada przez eksplorację. Sarsa uczy się bezpieczniejszej ścieżki dalej od klifu, bo \"wie\", że czasem wykona losowy ruch."}], "answer": "Q-Learning is off-policy because its update assumes the next action maximizes \\(Q\\), using \\(\\max_a Q(s',a)\\), regardless of which action the agent actually selects under its current behavior policy. [Source 4]"}, {"item": 18, "question": "When should you use Bellman-Ford instead of Dijkstra?", "key_points": ["when there are negative edge weights", "Dijkstra requires non-negative weights", "Bellman-Ford is slower, O(V*E)"], "context": [{"n": 1, "file": "syn_01_bellman_ford.txt", "text": "Najfajniejsza rzecz to wykrywanie ujemnych cykli: po V-1 przebiegach robimy jeszcze jeden, V-ty przebieg. Jeśli jakaś odległość nadal da się zmniejszyć, to znaczy, że w grafie jest cykl o ujemnej sumie wag i najkrótsza ścieżka po prostu nie istnieje (można kręcić się w kółko i zmniejszać koszt w nieskończoność). Na wykładzie był przykład z kursami walut: jeśli wagi to minus logarytmy kursów, ujemny cykl oznacza okazję do arbitrażu."}, {"n": 2, "file": "syn_01_bellman_ford.txt", "text": " W praktyce można przerwać algorytm wcześniej, jeśli w którymś przebiegu żadna odległość się nie zmieniła. Bellman-Ford jest też podstawą protokołów routingu typu distance-vector, gdzie każdy router zna tylko odległości od sąsiadów."}, {"n": 3, "file": "syn_02_a_star.txt", "text": "A* (A-star) is a best-first search algorithm for finding the shortest path from a start node to a single goal node. For every node it computes f(n) = g(n) + h(n), where g(n) is the real cost from the start to n and h(n) is a heuristic estimate of the remaining cost from n to the goal. The algorithm always expands the node with the lowest f from a priority queue (the open set). The heuristic is the whole trick."}, {"n": 4, "file": "syn_02_a_star.txt", "text": "If h never overestimates the true remaining cost, it is called admissible, and then A* is guaranteed to return an optimal path. A stronger property is consistency (monotonicity): h(n) <= cost(n, n') + h(n') for every edge; a consistent heuristic is always admissible and means a node never has to be reopened. On a grid where you can only move up, down, left and right, the Manhattan distance |dx| + |dy| is a good admissible heuristic; if diagonal moves are allowed you would use something else."}, {"n": 5, "file": "syn_02_a_star.txt", "text": " If you set h(n) = 0 for every node, A* behaves exactly like Dijkstra's algorithm. A better heuristic means fewer expanded nodes, which is why A* is popular in game pathfinding and robot navigation. The main downside is memory: A* keeps every generated node in memory, which can be a problem on huge graphs."}], "answer": "Bellman-Ford should be used instead of Dijkstra when the graph may contain negative edge weights, or when you need to detect negative cycles. The notes explain that Bellman-Ford can detect a negative cycle by running one extra pass after V-1 iterations: if any distance can still be decreased, a negative cycle exists and the shortest path is undefined [Source 1]. The notes also mention that the algorithm can stop early if no distance changes in a pass [Source 2].  The notes do not explicitly compare the two algorithms' performance or state directly that Dijkstra fails with negative weights, so that reasoning is not stated in the context."}, {"item": 19, "question": "Why is the maximum logit subtracted before computing softmax?", "key_points": ["numerical stability / avoids overflow of e^z", "does not change the result"], "context": [{"n": 1, "file": "student_note_06_relu.txt", "text": "ReLU, which stands for Rectified Linear Unit, is probably the most popular activation function in deep learning today. Its formula is incredibly simple: f(x) = max(0, x). This means that if the input is positive, the function just returns that value, but if the input is zero or negative, it returns zero. This simplicity makes it computationally very efficient, especially when compared to functions like Sigmoid or Tanh, which require expensive exponential calculations."}, {"n": 2, "file": "student_note_06_relu.txt", "text": "ReLU is essential because it introduces non-linearity, allowing neural networks to learn complex functions and patterns. One interesting detail is its derivative: it is exactly 1 for any positive value and 0 for anything else. However, we have to watch out for the 'dying ReLU' problem, where neurons get stuck at zero and stop learning because their gradient is zero. If you pass -5 into a ReLU neuron, the output is 0. If you pass that 0 into another ReLU, the output stays 0."}, {"n": 3, "file": "syn_11_softmax.txt", "text": "Softmax zamienia wektor dowolnych liczb (tzw. logitów) na rozkład prawdopodobieństwa: softmax(z_i) = e^(z_i) / suma_j e^(z_j). Wszystkie wyniki są dodatnie i sumują się do 1, dlatego softmax stosuje się w ostatniej warstwie klasyfikatora wieloklasowego. Funkcja wykładnicza wzmacnia różnice, więc największy logit dostaje wyraźnie największe prawdopodobieństwo. Często dodaje się parametr temperatury T: softmax(z_i / T)."}, {"n": 4, "file": "syn_11_softmax.txt", "text": "Przy T < 1 rozkład robi się bardziej \"ostry\" i prawie cała masa trafia do największego logitu, a przy T > 1 rozkład się spłaszcza i robi bardziej równomierny. Dokładnie tak działa temperatura przy generowaniu tekstu przez modele językowe: niska temperatura to bardziej przewidywalne odpowiedzi, wysoka to bardziej losowe. Do trenowania klasyfikatora z softmaxem używa się entropii krzyżowej (cross-entropy): L = -suma_i y_i * log(p_i), co przy etykiecie one-hot sprowadza się do minus logarytmu"}, {"n": 5, "file": "syn_11_softmax.txt", "text": "prawdopodobieństwa poprawnej klasy. Praktyczny szczegół to stabilność numeryczna: e^z dla dużych logitów przepełnia zakres liczb, więc przed liczeniem odejmuje się od wszystkich logitów ich maksimum, co nie zmienia wyniku."}], "answer": "The maximum logit is subtracted before computing softmax to ensure numerical stability, as exponentiating large logits can cause overflow in numerical computations; subtracting the maximum value does not change the result but prevents such issues [Source 5]."}, {"item": 20, "question": "What does the parameter b control in BM25?", "key_points": ["document length normalization", "0.75 default", "b = 0 turns it off"], "context": [{"n": 1, "file": "syn_05_bm25.txt", "text": "BM25 (Best Matching 25) is the ranking function used by most classic search engines, including Elasticsearch and Lucene by default. It can be seen as an improved TF-IDF. Two ideas make it better. First, term frequency saturation: in plain TF-IDF a word that appears 20 times counts twice as much as one that appears 10 times, but in BM25 the contribution of term frequency grows quickly at first and then flattens out."}, {"n": 2, "file": "syn_05_bm25.txt", "text": "The parameter k1 controls how fast it saturates; typical values are between 1.2 and 2.0. Second, document length normalization: a long document naturally contains more words, so BM25 divides by the document length relative to the average document length. The parameter b controls how strong this normalization is; b = 0.75 is the usual default, b = 0 turns length normalization off and b = 1 applies it fully. The IDF part is similar to TF-IDF: rare terms get a higher weight than common ones."}, {"n": 3, "file": "syn_05_bm25.txt", "text": " BM25 is a lexical method, so it only matches exact words; it does not know that \"car\" and \"automobile\" mean the same thing. That is why modern retrieval systems often combine BM25 with dense embeddings in a hybrid search."}], "answer": "The parameter b controls how strong the document length normalization is [Source 2]."}, {"item": 21, "question": "How does Leaky ReLU fix the dying ReLU problem?", "key_points": ["small slope alpha (0.01) for negative inputs", "gradient is not zero so the neuron can recover"], "context": [{"n": 1, "file": "student_note_06_relu.txt", "text": "ReLU, which stands for Rectified Linear Unit, is probably the most popular activation function in deep learning today. Its formula is incredibly simple: f(x) = max(0, x). This means that if the input is positive, the function just returns that value, but if the input is zero or negative, it returns zero. This simplicity makes it computationally very efficient, especially when compared to functions like Sigmoid or Tanh, which require expensive exponential calculations."}, {"n": 2, "file": "student_note_06_relu.txt", "text": "ReLU is essential because it introduces non-linearity, allowing neural networks to learn complex functions and patterns. One interesting detail is its derivative: it is exactly 1 for any positive value and 0 for anything else. However, we have to watch out for the 'dying ReLU' problem, where neurons get stuck at zero and stop learning because their gradient is zero. If you pass -5 into a ReLU neuron, the output is 0. If you pass that 0 into another ReLU, the output stays 0."}, {"n": 3, "file": "student_note_06_relu.txt", "text": " Changing a car tire requires a jack and a wrench, but ReLU only requires a simple comparison against zero."}, {"n": 4, "file": "syn_04_leaky_relu.txt", "text": "Leaky ReLU is a small change to ReLU that fixes the dying ReLU problem. Instead of returning zero for negative inputs, it returns a small slope: f(x) = x for x > 0 and f(x) = alpha * x for x <= 0, where alpha is usually 0.01. Because the gradient for negative inputs is alpha instead of zero, a neuron that ends up with negative inputs can still receive updates and recover, so it never becomes permanently dead. For example, an input of -5 gives -0.05 with alpha = 0.01."}, {"n": 5, "file": "syn_04_leaky_relu.txt", "text": "PReLU (Parametric ReLU) takes the same idea but makes alpha a parameter that the network learns during training, so each channel can find its own slope. ELU (Exponential Linear Unit) uses alpha * (e^x - 1) for negative inputs, which is smooth and pushes mean activations closer to zero, at the cost of computing an exponential. GELU is a smooth activation that weights the input by the probability that a standard normal variable is smaller than it; it is the default activation in transformer"}], "answer": "Leaky ReLU fixuje problem \"dying ReLU\" przez powodowanie neuronów, które mają negatywne wejścia, otrzymywać update, nie zawsze 0. W zamiast tego, dla wejść poniżej 0, ReLU zamiast 0 powoduje wyświetlanie wartości α * x, gdzie α jest zwykle 0.01. [Source 4]"}, {"item": 22, "question": "How does early stopping work?", "key_points": ["monitor validation loss", "stop when it stops improving for some epochs (patience)", "keep the best weights"], "context": [{"n": 1, "file": "syn_02_a_star.txt", "text": "A* (A-star) is a best-first search algorithm for finding the shortest path from a start node to a single goal node. For every node it computes f(n) = g(n) + h(n), where g(n) is the real cost from the start to n and h(n) is a heuristic estimate of the remaining cost from n to the goal. The algorithm always expands the node with the lowest f from a priority queue (the open set). The heuristic is the whole trick."}, {"n": 2, "file": "syn_02_a_star.txt", "text": "If h never overestimates the true remaining cost, it is called admissible, and then A* is guaranteed to return an optimal path. A stronger property is consistency (monotonicity): h(n) <= cost(n, n') + h(n') for every edge; a consistent heuristic is always admissible and means a node never has to be reopened. On a grid where you can only move up, down, left and right, the Manhattan distance |dx| + |dy| is a good admissible heuristic; if diagonal moves are allowed you would use something else."}, {"n": 3, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 4, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}, {"n": 5, "file": "syn_12_regularization.txt", "text": " Early stopping is the simplest technique: you monitor the validation loss and stop training when it stops improving for a few epochs (the patience), keeping the best weights. More training data is also a form of regularization, which is why data augmentation, such as flipping or cropping images, helps."}], "answer": "Early stopping works by monitoring the validation loss during training and stopping once it stops improving for a set number of epochs (the patience), while keeping the best weights found so far [Source 5]."}, {"item": 23, "question": "What is the Markov property?", "key_points": ["prawdopodobieństwa przejść i nagrody zależą wyłącznie od aktualnego stanu i akcji, a nie od historii"], "context": [{"n": 1, "file": "notatka_13_bayes.txt", "text": "Celem naiwnego klasyfikatora bayesowskiego jest probabilistyczna klasyfikacja obiektów poprzez wyznaczenie prawdopodobieństwa a posteriori poszczególnych klas. Definiuje się go jako klasyfikator oparty na twierdzeniu Bayesa, którego kluczową cechą jest naiwne założenie o niezależności atrybutów warunkowanej klasą. Matematycznie reprezentuje to wzór P(a_1=v_1, ..., a_n=v_n | c=d) = iloczyn po i z P(a_i=v_i | c=d)."}, {"n": 2, "file": "notatka_13_bayes.txt", "text": "Intuicyjnie, zamiast szukać w bazie identycznego pacjenta o dokładnie takich samych cechach, klasyfikator patrzy na każdy objaw z osobna i mnoży ich udziały, zakładając, że działają niezależnie. Klasycznym przykładem zastosowania jest klasyfikacja tekstu lub przewidywanie decyzji o grze na podstawie pogody (atrybuty takie jak outlook, temperature, humidity, wind). W przypadku wystąpienia prawdopodobieństw zerowych stosuje się wygładzanie Laplace'a, modyfikując wzór do postaci zawierającej"}, {"n": 3, "file": "notatka_14_wzmacnianie.txt", "text": "Uczenie się ze wzmocnieniem ma na celu długookresową maksymalizację nagród uzyskiwanych przez autonomicznego ucznia wchodzącego w interakcję z nieznanym środowiskiem. Formalną definicją matematyczną leżącą u podstaw tej teorii jest Proces Decyzyjny Markowa (MDP), opisywany jako czwórka zawierająca skończony zbiór stanów X, zbiór akcji A, funkcję przejść delta oraz funkcję nagród rho."}, {"n": 4, "file": "notatka_14_wzmacnianie.txt", "text": "Kluczowa jest tu własność Markowa mówiąca, że prawdopodobieństwa przejść i nagrody zależą wyłącznie od aktualnego stanu i podjętej akcji, a nie od historycznych kroków. Intuicyjnie system przypomina tresurę zwierzęcia lub naukę gry w szachy – uczeń nie dostaje instrukcji \"jak żyć\", a jedynie sygnały w postaci kar i nagród za swoje zachowanie. Zadanie polega na znalezieniu optymalnej strategii pi: X -> A, która maksymalizuje oczekiwaną sumę zdyskontowanych nagród, wyrażoną wzorem E[suma gamma^t"}, {"n": 5, "file": "syn_02_a_star.txt", "text": "A* (A-star) is a best-first search algorithm for finding the shortest path from a start node to a single goal node. For every node it computes f(n) = g(n) + h(n), where g(n) is the real cost from the start to n and h(n) is a heuristic estimate of the remaining cost from n to the goal. The algorithm always expands the node with the lowest f from a priority queue (the open set). The heuristic is the whole trick."}, {"n": 6, "file": "syn_02_a_star.txt", "text": "If h never overestimates the true remaining cost, it is called admissible, and then A* is guaranteed to return an optimal path. A stronger property is consistency (monotonicity): h(n) <= cost(n, n') + h(n') for every edge; a consistent heuristic is always admissible and means a node never has to be reopened. On a grid where you can only move up, down, left and right, the Manhattan distance |dx| + |dy| is a good admissible heuristic; if diagonal moves are allowed you would use something else."}], "answer": "The Markov property says that transition probabilities and rewards depend only on the current state and the action taken, not on the history of earlier steps [Source 4]. It is a key feature of the Markov Decision Process (MDP), which is the formal mathematical basis of reinforcement learning [Source 3][Source 4]."}, {"item": 24, "question": "What is the dying ReLU problem?", "key_points": ["neurons get stuck at zero", "stop learning because the gradient is zero"], "context": [{"n": 1, "file": "student_note_06_relu.txt", "text": "ReLU, which stands for Rectified Linear Unit, is probably the most popular activation function in deep learning today. Its formula is incredibly simple: f(x) = max(0, x). This means that if the input is positive, the function just returns that value, but if the input is zero or negative, it returns zero. This simplicity makes it computationally very efficient, especially when compared to functions like Sigmoid or Tanh, which require expensive exponential calculations."}, {"n": 2, "file": "student_note_06_relu.txt", "text": "ReLU is essential because it introduces non-linearity, allowing neural networks to learn complex functions and patterns. One interesting detail is its derivative: it is exactly 1 for any positive value and 0 for anything else. However, we have to watch out for the 'dying ReLU' problem, where neurons get stuck at zero and stop learning because their gradient is zero. If you pass -5 into a ReLU neuron, the output is 0. If you pass that 0 into another ReLU, the output stays 0."}, {"n": 3, "file": "student_note_06_relu.txt", "text": " Changing a car tire requires a jack and a wrench, but ReLU only requires a simple comparison against zero."}, {"n": 4, "file": "syn_04_leaky_relu.txt", "text": "Leaky ReLU is a small change to ReLU that fixes the dying ReLU problem. Instead of returning zero for negative inputs, it returns a small slope: f(x) = x for x > 0 and f(x) = alpha * x for x <= 0, where alpha is usually 0.01. Because the gradient for negative inputs is alpha instead of zero, a neuron that ends up with negative inputs can still receive updates and recover, so it never becomes permanently dead. For example, an input of -5 gives -0.05 with alpha = 0.01."}, {"n": 5, "file": "syn_04_leaky_relu.txt", "text": "PReLU (Parametric ReLU) takes the same idea but makes alpha a parameter that the network learns during training, so each channel can find its own slope. ELU (Exponential Linear Unit) uses alpha * (e^x - 1) for negative inputs, which is smooth and pushes mean activations closer to zero, at the cost of computing an exponential. GELU is a smooth activation that weights the input by the probability that a standard normal variable is smaller than it; it is the default activation in transformer"}], "answer": "The dying ReLU problem occurs when neurons get stuck at zero and stop learning because their gradient is zero [Source 2]."}, {"item": 25, "question": "What is Bellman-Ford used for?", "key_points": ["single-source shortest paths", "works with negative edge weights", "detects negative cycles"], "context": [{"n": 1, "file": "syn_01_bellman_ford.txt", "text": "Najfajniejsza rzecz to wykrywanie ujemnych cykli: po V-1 przebiegach robimy jeszcze jeden, V-ty przebieg. Jeśli jakaś odległość nadal da się zmniejszyć, to znaczy, że w grafie jest cykl o ujemnej sumie wag i najkrótsza ścieżka po prostu nie istnieje (można kręcić się w kółko i zmniejszać koszt w nieskończoność). Na wykładzie był przykład z kursami walut: je
