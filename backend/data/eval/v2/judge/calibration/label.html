śli wagi to minus logarytmy kursów, ujemny cykl oznacza okazję do arbitrażu."}, {"n": 2, "file": "syn_01_bellman_ford.txt", "text": " W praktyce można przerwać algorytm wcześniej, jeśli w którymś przebiegu żadna odległość się nie zmieniła. Bellman-Ford jest też podstawą protokołów routingu typu distance-vector, gdzie każdy router zna tylko odległości od sąsiadów."}, {"n": 3, "file": "syn_05_bm25.txt", "text": "The parameter k1 controls how fast it saturates; typical values are between 1.2 and 2.0. Second, document length normalization: a long document naturally contains more words, so BM25 divides by the document length relative to the average document length. The parameter b controls how strong this normalization is; b = 0.75 is the usual default, b = 0 turns length normalization off and b = 1 applies it fully. The IDF part is similar to TF-IDF: rare terms get a higher weight than common ones."}, {"n": 4, "file": "syn_05_bm25.txt", "text": " BM25 is a lexical method, so it only matches exact words; it does not know that \"car\" and \"automobile\" mean the same thing. That is why modern retrieval systems often combine BM25 with dense embeddings in a hybrid search."}, {"n": 5, "file": "syn_12_regularization.txt", "text": "Regularization is a set of techniques that reduce overfitting by limiting how closely a model can fit the training data. L2 regularization (ridge, or weight decay in neural networks) adds lambda times the sum of squared weights to the loss. It pushes all weights towards small values but rarely makes them exactly zero. L1 regularization (lasso) adds lambda times the sum of absolute weights instead; because of the shape of the absolute value it drives many weights to exactly zero, so it also"}, {"n": 6, "file": "syn_12_regularization.txt", "text": "works as automatic feature selection. The strength lambda is a hyperparameter: too small and nothing changes, too large and the model underfits. Dropout is a regularization method specific to neural networks: during training each neuron is switched off with probability p (0.5 is a classic value for hidden layers), so the network cannot rely on any single neuron and effectively trains an ensemble of thinner networks. At inference time dropout is turned off."}, {"n": 7, "file": "syn_12_regularization.txt", "text": " Early stopping is the simplest technique: you monitor the validation loss and stop training when it stops improving for a few epochs (the patience), keeping the best weights. More training data is also a form of regularization, which is why data augmentation, such as flipping or cropping images, helps."}], "answer": "Bellman-Ford jest podstawą protokołów routingu typu distance-vector, gdzie każdy router zna tylko odległości od sąsiadów [Source 2]. Algorytm pozwala też wykrywać ujemne cykle: jeśli po V-tym przebiegu odległość nadal da się zmniejszyć, oznacza to, że najkrótsza ścieżka nie istnieje [Source 1]."}];
const KEY = 'notes-rag.calibration.v1';
const VERDICTS = [['correct', 'Correct', '1'], ['partially_correct', 'Partially correct', '2'], ['incorrect', 'Incorrect', '3']];
let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { /* private mode: labels live in this tab only */ }
let pos = Math.max(0, ITEMS.findIndex((it) => !complete(it.item)));
if (pos < 0) pos = 0;

function complete(id) { const l = labels[id]; return l && l.verdict && typeof l.faithful === 'boolean'; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch { /* ignore */ } }
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }

function render() {
  const main = document.getElementById('main');
  const done = ITEMS.filter((it) => complete(it.item)).length;
  document.getElementById('bar').style.width = `${(100 * done) / ITEMS.length}%`;
  document.getElementById('count').textContent = `${done} / ${ITEMS.length} labelled`;
  main.replaceChildren();
  if (pos >= ITEMS.length) {
    const d = el('section', 'done');
    d.append(el('p', '', `All ${ITEMS.length} items labelled. Click "Download labels.json" and save it into this folder.`));
    main.append(d); return;
  }
  const it = ITEMS[pos];
  const l = labels[it.item] || (labels[it.item] = {});

  const left = el('section');
  left.append(el('h2', '', `Item ${pos + 1} of ${ITEMS.length} · question`), el('p', 'q', it.question));
  left.append(el('h2', '', 'Expected key points'));
  const ul = el('ul', 'kp'); it.key_points.forEach((k) => ul.append(el('li', '', k))); left.append(ul);
  left.append(el('h2', '', 'Answer to grade'), el('div', 'answer', it.answer));

  const right = el('section');
  right.append(el('h2', '', 'Context the model saw'));
  // Open the chunks the answer cites (that is what faithfulness is checked against); the rest stay one click away.
  const citedIds = new Set([...it.answer.matchAll(/\[Sources?\s*([\d,\s&and]+)\]/gi)].flatMap((m) => m[1].match(/\d+/g).map(Number)));
  right.append(el('p', 'help', citedIds.size ? 'Cited sources are expanded.' : 'The answer cites no source — check all chunks.'));
  it.context.forEach((c) => {
    const d = el('details'); d.open = citedIds.has(c.n) || it.context.length <= 3;
    d.append(el('summary', '', `[Source ${c.n}] ${c.file}`), el('p', '', c.text)); right.append(d);
  });

  const rate = el('section', 'rate');
  const r1 = el('div', 'row'); r1.append(el('span', 'label', 'Does it convey the key points?'));
  VERDICTS.forEach(([v, text, k]) => {
    const b = el('button', l.verdict === v ? 'on' : ''); b.append(text, el('kbd', '', k));
    b.onclick = () => { l.verdict = v; save(); render(); }; r1.append(b);
  });
  const r2 = el('div', 'row'); r2.append(el('span', 'label', 'Claims NOT supported by the context?'));
  [[true, 'No — faithful', 'f'], [false, 'Yes — unsupported claims', 'u']].forEach(([v, text, k]) => {
    const b = el('button', l.faithful === v ? 'on' : ''); b.append(text, el('kbd', '', k));
    b.onclick = () => { l.faithful = v; save(); render(); }; r2.append(b);
  });
  const note = el('textarea'); note.placeholder = 'Optional note (why?)'; note.value = l.note || '';
  note.oninput = () => { l.note = note.value; save(); };
  const nav = el('div', 'nav');
  const prev = el('button', '', '← Previous'); prev.onclick = () => { pos = Math.max(0, pos - 1); render(); };
  const next = el('button', '', complete(it.item) ? 'Next →' : 'Next (skip) →'); next.onclick = () => { pos += 1; render(); };
  nav.append(prev, el('span', 'help', 'Keys: 1/2/3 verdict · f/u faithfulness · Enter next · Backspace previous'), next);
  rate.append(r1, r2, note, nav);
  main.append(left, right, rate);
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || pos >= ITEMS.length) return;
  const l = labels[ITEMS[pos].item];
  const v = VERDICTS.find(([, , k]) => k === e.key);
  if (v) { l.verdict = v[0]; save(); render(); }
  else if (e.key === 'f') { l.faithful = true; save(); render(); }
  else if (e.key === 'u') { l.faithful = false; save(); render(); }
  else if (e.key === 'Enter') { pos += 1; render(); }
  else if (e.key === 'Backspace') { pos = Math.max(0, pos - 1); render(); }
});

document.getElementById('download').onclick = () => {
  const out = { labelled_at: new Date().toISOString(), labels: ITEMS.map((it) => ({ item: it.item, ...(labels[it.item] || {}) })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'labels.json'; a.click();
};
render();
</script>
