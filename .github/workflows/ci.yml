name: CI

on:
  push:
    branches: [develop, master, "feature/**"]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_CPU: torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install $TORCH_CPU && pip install -r requirements-dev.txt
      - run: ruff check app tests smoke_test.py
      - run: pytest

  retrieval:
    name: Retrieval gate (free)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/config.py') }}
      - run: pip install $TORCH_CPU && pip install -r requirements.txt
      - run: python -m app.ingest_corpus --corpus v2
      - name: Benchmark questions — right note in the context
        run: python -m app.run_model_benchmark --corpus v2 --retrieval-only --min-hit-rate 0.95
      - name: Polish probe — right note in the context
        run: python -m app.run_model_benchmark --corpus v2 --retrieval-only --min-hit-rate 0.95 --dataset-path data/eval/v2/questions_pl_probe.json

  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t notes-rag-assistant:ci .
      - run: docker run -d --name app -p 8000:8000 notes-rag-assistant:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs app; exit 1
      # No API key in this job: /ask returns the extractive fallback, which still exercises retrieval end to end.
      - run: docker exec app python smoke_test.py
      - if: failure()
        run: docker logs app
