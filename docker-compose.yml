# docker compose up --build   →   http://localhost:8000
services:
  app:
    build: .
    image: notes-rag-assistant
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env   # OPENROUTER_API_KEY (copy backend/.env.example); optional for local Ollama-only use
        required: false
    volumes:
      - chroma:/app/backend/data/chroma
    restart: unless-stopped

volumes:
  chroma:
