<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
<title id="t">Retrieval hit rate by top_k, same-language vs cross-language</title>
<desc id="d">same language: top_k 1=97%, top_k 2=100%, top_k 3=100%, top_k 5=100%, top_k 8=100%; cross-language: top_k 1=40%, top_k 2=58%, top_k 3=62%, top_k 5=71%, top_k 8=81%</desc>
<style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h1 { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12px; fill: #59636e; }
    .ptitle { font-size: 13px; font-weight: 600; }
    .dir { font-size: 11px; fill: #818b98; }
    .label { font-size: 12px; fill: #59636e; }
    .label-em { font-size: 12px; font-weight: 600; fill: #1f2328; }
    .val { font-size: 12px; font-variant-numeric: tabular-nums; }
    .tick { font-size: 10.5px; fill: #818b98; font-variant-numeric: tabular-nums; }
    .legend { font-size: 12px; fill: #59636e; }
    </style>
<rect x="0.5" y="0.5" width="899" height="339" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<text x="24.0" y="32.0" class="h1" text-anchor="start" >Retrieval: how often is the right note in the context?</text>
<text x="24.0" y="52.0" class="sub" text-anchor="start" >77 in-scope questions on corpus v2 (English-centric embeddings, all-MiniLM-L6-v2). Cross-language = question and note in different languages (EN↔PL).</text>
<line x1="64" y1="300.0" x2="736" y2="300.0" stroke="#c8ccd1" stroke-width="1"/>
<text x="56.0" y="304.0" class="tick" text-anchor="end" >0%</text>
<line x1="64" y1="248.0" x2="736" y2="248.0" stroke="#e7e9ec" stroke-width="1"/>
<text x="56.0" y="252.0" class="tick" text-anchor="end" >25%</text>
<line x1="64" y1="196.0" x2="736" y2="196.0" stroke="#e7e9ec" stroke-width="1"/>
<text x="56.0" y="200.0" class="tick" text-anchor="end" >50%</text>
<line x1="64" y1="144.0" x2="736" y2="144.0" stroke="#e7e9ec" stroke-width="1"/>
<text x="56.0" y="148.0" class="tick" text-anchor="end" >75%</text>
<line x1="64" y1="92.0" x2="736" y2="92.0" stroke="#e7e9ec" stroke-width="1"/>
<text x="56.0" y="96.0" class="tick" text-anchor="end" >100%</text>
<text x="64.0" y="318.0" class="tick" text-anchor="middle" >top_k 1</text>
<text x="232.0" y="318.0" class="tick" text-anchor="middle" >top_k 2</text>
<text x="400.0" y="318.0" class="tick" text-anchor="middle" >top_k 3</text>
<text x="568.0" y="318.0" class="tick" text-anchor="middle" >top_k 5</text>
<text x="736.0" y="318.0" class="tick" text-anchor="middle" >top_k 8</text>
<line x1="400.0" y1="92" x2="400.0" y2="300" stroke="#818b98" stroke-width="1"/>
<text x="406.0" y="292.0" class="dir" text-anchor="start" >used in the model benchmark</text>
<polyline points="64.0,99.2 232.0,92.0 400.0,92.0 568.0,92.0 736.0,92.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.0" cy="99.2" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>same language, top_k 1: 97%</title></circle>
<circle cx="232.0" cy="92.0" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>same language, top_k 2: 100%</title></circle>
<circle cx="400.0" cy="92.0" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>same language, top_k 3: 100%</title></circle>
<circle cx="568.0" cy="92.0" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>same language, top_k 5: 100%</title></circle>
<circle cx="736.0" cy="92.0" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>same language, top_k 8: 100%</title></circle>
<line x1="750" y1="92.0" x2="762" y2="92.0" stroke="#2a78d6" stroke-width="2"/>
<text x="768.0" y="96.0" class="label" text-anchor="start" >same language (n=29)</text>
<text x="400.0" y="82.0" class="val" text-anchor="middle" >100%</text>
<polyline points="64.0,217.7 232.0,178.7 400.0,170.0 568.0,152.7 736.0,131.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.0" cy="217.7" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"><title>cross-language, top_k 1: 40%</title></circle>
<circle cx="232.0" cy="178.7" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"><title>cross-language, top_k 2: 58%</title></circle>
<circle cx="400.0" cy="170.0" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"><title>cross-language, top_k 3: 62%</title></circle>
<circle cx="568.0" cy="152.7" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"><title>cross-language, top_k 5: 71%</title></circle>
<circle cx="736.0" cy="131.0" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"><title>cross-language, top_k 8: 81%</title></circle>
<line x1="750" y1="131.0" x2="762" y2="131.0" stroke="#eb6834" stroke-width="2"/>
<text x="768.0" y="135.0" class="label" text-anchor="start" >cross-language (n=48)</text>
<text x="400.0" y="160.0" class="val" text-anchor="middle" >62%</text>
</svg>
