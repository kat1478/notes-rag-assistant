<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
<title id="t">Cross-language retrieval hit rate by top_k, before/after</title>
<desc id="d">sentence-transformers/all-MiniLM-L6-v2: top_k 1=0.351, top_k 2=0.509, top_k 3=0.561, top_k 5=0.632, top_k 8=0.719; sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2: top_k 1=0.86, top_k 2=0.982, top_k 3=1.0, top_k 5=1.0, top_k 8=1.0</desc>
<style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
