<rect x="0.5" y="0.5" width="899" height="339" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="24.0" y="32.0" class="h1" text-anchor="start" >Cross-language retrieval before and after switching the embedding model</text>
<text x="24.0" y="52.0" class="sub" text-anchor="start" >57 questions whose language differs from their note&#x27;s (EN↔PL) · share with the right note in the top k · same-language questions stay ≥ 95% with both models</text>
