<circle cx="64.0" cy="121.1" r="4.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"><title>after: multilingual-MiniLM-L12, top_k 1: 86%</title></circle>
<circle cx="219.5" cy="95.7" r="4.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"><title>after: multilingual-MiniLM-L12, top_k 2: 98%</title></circle>
